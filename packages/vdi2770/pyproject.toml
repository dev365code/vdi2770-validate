[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vdi2770"
version = "0.2.0"
description = "Read a VDI 2770 handover-documentation container safely — no dependencies, no disk, no network"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Wooyong Lee" }]
keywords = ["vdi2770", "technical documentation", "handover documentation", "industry 4.0", "zip"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: XML",
  "Typing :: Typed",
]
# No dependencies, and that is a feature rather than an omission. See README.
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.16.3"]

[project.urls]
Homepage = "https://github.com/dev365code/vdi2770-validate/tree/main/packages/vdi2770"
Source = "https://github.com/dev365code/vdi2770-validate"
Issues = "https://github.com/dev365code/vdi2770-validate/issues"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vdi2770 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
