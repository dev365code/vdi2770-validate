[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vdi2770"
# The same number as `vdi2770-validate`, which pins it exactly. They are one
# release in two parts: released under one tag, tested against each other, and
# a machine that has one has the other. See
# tests/test_the_two_halves_carry_one_version.py for what that costs and buys.
version = "0.8.1.dev0"
description = "Read a VDI 2770 handover-documentation container safely — no dependencies, no disk, no network"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Wooyong Lee" }]
keywords = ["vdi2770", "technical documentation", "handover documentation", "industry 4.0", "zip"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: XML",
  "Typing :: Typed",
]
# No dependencies, and that is a feature rather than an omission. See README.
dependencies = []

[project.optional-dependencies]
# The schema check, and only it, needs a parser — `xsdvalidate` imports it
# inside the function that uses it. Optional so that `pip install vdi2770`
# stays what the line above calls it: a reader with no dependencies. A
# machine that installs the reader alone and then asks for a schema check
# gets `X0`, which is this tool declining to look rather than a verdict on
# anybody's container.
validate = ["xmlschema==4.2.0"]
dev = ["pytest==8.3.4", "ruff==0.16.3"]

[project.urls]
Homepage = "https://github.com/dev365code/vdi2770-validate/tree/main/packages/vdi2770"
Source = "https://github.com/dev365code/vdi2770-validate"
Issues = "https://github.com/dev365code/vdi2770-validate/issues"

[tool.setuptools]
# The wheel bundles VDI's schema and a table derived from an IDTA
# publication, so the notices have to travel with it.
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vdi2770 = ["py.typed"]
"vdi2770.validate" = ["data/*.json", "data/*.xsd"]

# How this package's own suite runs is in `pytest.ini` beside this file, not
# here: it is not about packaging, and it has to keep working in an sdist that
# carries the tests and not the manifest.
