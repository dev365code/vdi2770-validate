# The reader's suite, run from this directory with only the reader on the path.
#
# `make standalone` runs each file here on its own from inside this directory,
# which is what makes "the reader needs nothing but itself" a measurement rather
# than a claim: nothing from the repository root is importable, so a test that
# quietly leans on the rules fails here and nowhere else.
#
# This used to be the `[tool.pytest.ini_options]` block of a `pyproject.toml`
# that also declared a name, a version and a dependency list, because the reader
# was published as its own distribution. It is not any more — it ships inside
# `vdi2770` — and the manifest went with it. The test settings are not about
# packaging and had no reason to go too.
[pytest]
testpaths = tests
pythonpath = src tests
addopts = -q
