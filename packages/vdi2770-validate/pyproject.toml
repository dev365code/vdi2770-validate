# The old distribution name, kept resolving.
#
# This project published as `vdi2770-validate` from 0.1.0 to 0.6.0, and the name
# is in requirements files and CI configurations this repository cannot see. A
# rename on a package index is not a rename: the old name goes on resolving to
# whatever was last published under it, so anyone who does not read a changelog
# keeps installing 0.6.0 and never learns there is anything newer.
#
# So the name keeps being published, as metadata and nothing else, depending on
# the package it was renamed to. `pip install vdi2770-validate` installs
# `vdi2770`; the `vdi2770-validate` command and `import vdi2770_validate` both
# still work, because they come from the renamed package rather than from a copy.
#
# Metadata and nothing else, and that is the load-bearing part. Two
# distributions that both ship `vdi2770_validate/` overwrite each other's files
# — pip does not refuse it, it installs whichever went last, and uninstalling
# the shim afterwards deletes the real tool. A redirect that owns no import name
# cannot do that.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vdi2770-validate"
version = "0.7.0"
description = "Renamed to `vdi2770` — installing this installs that"
readme = "README.md"
# The same floor as what it points at. A shim that installs on a Python the
# real package refuses would resolve, then fail at the dependency, and the
# error would name the wrong package.
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Wooyong Lee" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
# `>=` and not `~=`: this exists so the old name never goes stale, and a
# compatible-release pin would stop admitting the tool at the next minor. The
# floor is what makes it a redirect rather than a no-op — without it, a machine
# that already has an older `vdi2770` is already satisfied and installs nothing.
dependencies = ["vdi2770>=0.7"]

[project.urls]
Homepage = "https://github.com/dev365code/vdi2770-validate"
Source = "https://github.com/dev365code/vdi2770-validate"
Changelog = "https://github.com/dev365code/vdi2770-validate/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = []
license-files = ["LICENSE", "NOTICE"]
