[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vdi2770-validate"
version = "0.4.0.dev0"
description = "Offline conformance checker for VDI 2770 containers — every finding comes with a remedy"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Wooyong Lee" }]
keywords = ["vdi2770", "technical documentation", "conformance", "validation", "industry 4.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
# The readers were lifted out into `vdi2770`, which has no dependencies of its
# own; this package is that library plus a rule set. Pinned to the 0.1 line
# because pre-1.0 the minor number is where the breaking changes live.
dependencies = ["vdi2770~=0.3.0", "xmlschema==4.2.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.16.3"]

[project.scripts]
vdi2770-validate = "vdi2770_validate.cli:main"

[tool.setuptools]
# The wheel bundles VDI's schema and a table derived from an IDTA publication,
# so the notices have to travel with it.
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vdi2770_validate = ["data/*.json", "data/*.xsd"]

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests", "tools", "packages/vdi2770/src", "packages/vdi2770/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "UP006", "UP007", "UP035", "UP045",  # py39 target: keep typing.List / Optional
    "E501",                              # line length is a formatting matter
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]           # sys.path must be set before the package import
"tests/*.py" = ["E402"]
"tools/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/vdi2770/tests"]
pythonpath = ["src", "packages/vdi2770/src"]
addopts = "-q"
