[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vdi2770"
version = "0.7.0"
description = "Read and check VDI 2770 handover-documentation containers, offline — every finding comes with a remedy"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Wooyong Lee" }]
keywords = ["vdi2770", "technical documentation", "conformance", "validation", "industry 4.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
# One distribution, two layers. The readers used to be a separate distribution
# this one pinned with `~=`, and the pin was a standing way to be wrong: it had
# already let pip install a reader without the fix the release existed for, and
# the floor had to be tightened to the exact version. It cannot be wrong now
# because it is not there — the reader is the other half of this package, and
# `import vdi2770` still costs nothing (a test reads its imports and says so).
dependencies = ["xmlschema==4.2.0"]

[project.urls]
Homepage = "https://github.com/dev365code/vdi2770-validate"
Source = "https://github.com/dev365code/vdi2770-validate"
Issues = "https://github.com/dev365code/vdi2770-validate/issues"
Changelog = "https://github.com/dev365code/vdi2770-validate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.16.3"]

[project.scripts]
# The name people will learn, and the one already in their scripts. The second
# is not deprecated: a command that used to work and stops working is a cost
# paid by whoever automated it, and this one costs a line to keep.
vdi2770 = "vdi2770_validate.cli:_run"
vdi2770-validate = "vdi2770_validate.cli:_run"

[tool.setuptools]
# The wheel bundles VDI's schema and a table derived from an IDTA publication,
# so the notices have to travel with it.
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md",
                 "packages/vdi2770/NOTICE"]

[tool.setuptools.packages.find]
# Both halves, from where each has always lived. The reader keeps its own
# directory and its own tests: what changed is that it ships inside this
# distribution rather than beside it.
where = ["src", "packages/vdi2770/src"]

[tool.setuptools.package-data]
vdi2770_validate = ["data/*.json", "data/*.xsd"]
vdi2770 = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests", "tools", "packages/vdi2770/src", "packages/vdi2770/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "UP006", "UP007", "UP035", "UP045",  # py39 target: keep typing.List / Optional
    "E501",                              # line length is a formatting matter
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]           # sys.path must be set before the package import
"tests/*.py" = ["E402"]
"tools/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/vdi2770/tests"]
# `packages/vdi2770/tests` too: `nodisk.py` lives with the package whose
# promise it guards, and both suites import the one copy.
pythonpath = ["src", "packages/vdi2770/src", "packages/vdi2770/tests"]
addopts = "-q"
