[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vdi2770-validate"
version = "0.8.1.dev0"
# What this distribution is, rather than what it brings. It brings the whole
# tool -- that is the point of it -- but a page describing a conformance checker
# for a package containing two lines of alias is the kind of near-truth this
# project spends its time removing.
description = "The old import name for vdi2770.validate — installs the whole tool"
readme = "README-vdi2770-validate.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Wooyong Lee" }]
keywords = ["vdi2770", "technical documentation", "conformance", "validation", "industry 4.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
# The readers live in `vdi2770`, which has no dependencies of its own; this
# package is that library plus a rule set. The reader is named exactly, not by
# range: `~=0.3.0` once let pip install 0.3.0 beside vdi2770-validate 0.5.0,
# and the fix that release existed for was in the reader — a range that merely
# permits the fixed version does not deliver it. The two numbers move together
# and go out under one tag, so there is no version of one to pair with a
# different version of the other.
# The validator lives in `vdi2770` now and this distribution is the old
# import name kept working. A range rather than an exact pin, because what
# this ships is a two-line alias: there is no version of it that can
# disagree with a version of the engine. The exact pin existed to stop the
# pair being half-moved, and after the merge there is no pair to move.
dependencies = ["vdi2770[validate]>=0.8.1.dev0"]

[project.urls]
Homepage = "https://github.com/dev365code/vdi2770-validate"
Source = "https://github.com/dev365code/vdi2770-validate"
Issues = "https://github.com/dev365code/vdi2770-validate/issues"
Changelog = "https://github.com/dev365code/vdi2770-validate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Named here rather than inherited from whatever a machine happens to carry.
# `PyYAML` was installed on the machine that wrote the gate reading the release
# workflow and declared nowhere, so four green gates locally meant nothing about
# CI; `packaging` was the same shape and had not gone off yet, quietly green on
# every push because the runner image carries it.
dev = ["build==1.4.4", "packaging==26.3", "pytest==8.3.4", "PyYAML==6.0.3",
       "ruff==0.16.3",
       # 3.11 has `tomllib`; below it a manifest has to be read by something.
       # The gates here read manifests rather than pattern-matching them --
       # four regexes over one file format were wrong about four spellings
       # setuptools accepts, one of which produced the exact collision they
       # exist to prevent.
       "tomli==2.4.1; python_version < '3.11'"]

[project.scripts]
# One command, and deliberately not also `vdi2770`: that is the *other*
# distribution's name, and a `vdi2770` command shipped from here would make
# `pip install vdi2770` produce something that imports and has nothing to run.
vdi2770-validate = "vdi2770_validate.entry:run"

[tool.setuptools]
# The wheel bundles VDI's schema and a table derived from an IDTA publication,
# so the notices have to travel with it.
# The schema and the IDTA-derived table ship with `vdi2770` now, so the
# notices for them travel there. What is left here is an alias.
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
# This distribution only. The reader is built from its own manifest under
# `packages/vdi2770` and installed as a dependency, never vendored in here —
# two distributions shipping one import package is the failure the pin exists
# to keep unreachable.
where = ["src"]



[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests", "tools", "packages/vdi2770/src", "packages/vdi2770/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "UP006", "UP007", "UP035", "UP045",  # py39 target: keep typing.List / Optional
    "E501",                              # line length is a formatting matter
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]           # sys.path must be set before the package import
"tests/*.py" = ["E402"]
"tools/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/vdi2770/tests"]
# `packages/vdi2770/tests` too: `nodisk.py` lives with the package whose
# promise it guards, and both suites import the one copy.
pythonpath = ["src", "packages/vdi2770/src", "packages/vdi2770/tests"]
# `-rs`: a skipped test is a gate that did not run, and a bare count says
# nothing about which one. Two of the skips here are the version gates,
# which have nothing to compare until the release is tagged and do run in
# the release workflow -- but that is a sentence somebody has to be able to
# check, and they cannot check it against "3 skipped".
addopts = "-q -rs"
