name: "VDI 2770 container check"
description: >
  Check VDI 2770 document containers in a workflow. It installs the released
  checker from PyPI and runs it, or runs a single file you already have -- no
  socket opened while checking either way, and the exit code the command line
  gives you.
author: "dev365code"
branding:
  icon: "check-square"
  color: "blue"

inputs:
  paths:
    description: "Containers to check. Several, separated by spaces."
    required: true
  version:
    description: >
      Which release's single file to run. Defaults to the version of the
      checkout this action came from, so `uses: ...@v0.9.1` runs 0.9.1.
    required: false
    default: ""
  pyz:
    description: >
      A `vdi2770.pyz` you already have. Given, this action installs nothing and
      fetches nothing -- which is the point of carrying one file, and what a
      runner with no route to an index needs. (The job around it still reached
      GitHub to get here; that is the runner's doing, not this step's.)
    required: false
    default: ""
  sha256:
    description: >
      The SHA-256 that `pyz` must have. Useful when the file is carried into a
      closed network and somebody wants the step to check it rather than trust
      it. The default path does not need this: `pip` checks what an index serves
      against the hashes that index publishes.
    required: false
    default: ""
  args:
    description: "Anything else to pass to `check`, such as `--json`."
    required: false
    default: ""
  fail-on-finding:
    description: >
      Fail the step when the checker returns anything but 0. True by default,
      because a gate that does not stop anything is decoration. Set it false when
      you want the job to carry on and read `exit-code` instead -- to report
      rather than to stop.
    required: false
    default: "true"

outputs:
  exit-code:
    description: >
      What the checker returned: 0 nothing at the fail severity, 1 a finding or
      an unreadable path, 2 nothing could be read, 3 the install disagreed with
      itself, 64 a usage error. Readable in both modes -- a failed step does
      still publish this, which CI measured rather than assumed -- so with the
      default you need `continue-on-error: true` on the step to reach the line
      that reads it. The code is printed either way.
    value: ${{ steps.check.outputs.exit-code }}
  pyz:
    description: >
      The single file this step ran, when it ran one. Empty on the default path,
      which installs instead. Published so a caller can ask the file itself what
      version it is rather than trust that the right one was chosen.
    value: ${{ steps.check.outputs.pyz }}
  version:
    description: >
      The version this step decided to run -- from `version`, or from the ref
      you pinned, or from the tree the action came from. Published because
      "which checker ran" is the question a verdict is only meaningful against.
    value: ${{ steps.obtain.outputs.version }}

runs:
  using: "composite"
  steps:
    # The only step that touches the network, and only when you have not handed
    # it a file. The check itself opens no socket for any input, ever -- that is
    # the tool's own promise and its own test, not this action's.
    # The only step that reaches an index, and only when you have not handed it
    # a file. It installs the released checker rather than downloading a release
    # asset: assets are attached by a person and a person can forget, while
    # publishing to the index is what the release workflow does on its own. The
    # check itself opens no socket for any input -- that is the tool's promise
    # and its own test, not this action's.
    - id: obtain
      if: inputs.pyz == ''
      shell: bash
      env:
        WANTED: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        PY=$(command -v python3 || command -v python || true)
        if [ -z "$PY" ]; then
          echo "::error::no python on PATH. Add actions/setup-python before this step, or put one there."
          exit 64
        fi

        version="$WANTED"
        # The ref the caller actually wrote, when it looks like a release: this
        # repository tags the validator `v*` and the reader `sdk-v*`, and reading
        # the reader's `__version__` would have chosen 0.4.0 for `@v0.6.0` --
        # "a checker nobody asked for", which is what this step refuses to do.
        if [ -z "$version" ]; then
          case "$ACTION_REF" in
            v[0-9]*) version="${ACTION_REF#v}" ;;
          esac
        fi
        # A branch, a commit, or `./`: the version this tree publishes, which is
        # the top-level one -- the `v*` stream.
        if [ -z "$version" ]; then
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$ACTION_PATH/pyproject.toml" | head -1)
        fi
        if [ -z "$version" ]; then
          echo "::error::cannot tell which version to run, and guessing one would run a checker nobody asked for"
          exit 64
        fi

        target="${RUNNER_TEMP:-/tmp}/vdi2770-validate"
        # `--target`, so the caller's environment is left as it was found; and
        # `--only-binary :all:`, so nothing is built from source on a machine
        # this action does not own.
        "$PY" -m pip install --disable-pip-version-check --no-input \
          --only-binary :all: --target "$target" "vdi2770-validate==$version"
        echo "target=$target" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - id: check
      shell: bash
      env:
        PYZ: ${{ inputs.pyz }}
        WANT_SHA: ${{ inputs.sha256 }}
        TARGET: ${{ steps.obtain.outputs.target }}
        PATHS: ${{ inputs.paths }}
        EXTRA: ${{ inputs.args }}
        FAIL_ON_FINDING: ${{ inputs.fail-on-finding }}
      run: |
        set -uo pipefail
        PY=$(command -v python3 || command -v python || true)
        if [ -z "$PY" ]; then
          echo "::error::no python on PATH. Add actions/setup-python before this step, or put one there."
          exit 64
        fi

        # Two ways in, one invocation. The single file when you carried one --
        # and then its hash, if you asked for that; the installed distribution
        # otherwise. Nothing downstream knows which door was used.
        if [ -n "$PYZ" ]; then
          if [ ! -f "$PYZ" ]; then
            echo "::error::no checker to run at [$PYZ]. Give pyz: a file that exists, or leave it empty to install one."
            exit 64
          fi
          if [ -n "$WANT_SHA" ]; then
            if command -v sha256sum >/dev/null 2>&1; then
              got=$(sha256sum "$PYZ" | cut -d" " -f1)
            else
              got=$(shasum -a 256 "$PYZ" | cut -d" " -f1)
            fi
            want=$(printf '%s' "$WANT_SHA" | tr 'A-Z' 'a-z' | tr -d '[:space:]')
            got=$(printf '%s' "$got" | tr 'A-Z' 'a-z')
            if [ "$got" != "$want" ]; then
              echo "::error::[$PYZ] hashes to $got and you asked for $want"
              exit 64
            fi
          fi
          echo "pyz=$PYZ" >> "$GITHUB_OUTPUT"
          set -- "$PY" "$PYZ" check
        else
          if [ -z "${TARGET:-}" ] || [ ! -d "${TARGET:-}" ]; then
            echo "::error::nothing was installed to run. The install step did not leave anything behind."
            exit 64
          fi
          export PYTHONPATH="$TARGET"
          set -- "$PY" -m vdi2770_validate check
        fi

        # Build the argument list by hand. `paths` written as a YAML block is one
        # container per line -- which is the only way to name a file whose
        # directory has a space in it, and directories do. Written on one line it
        # is still space-separated, the way the input has always been documented.
        newline=$(printf '\nx'); newline=${newline%x}
        old_ifs=$IFS
        set -f                          # a container called `a[1].zip` is a file,
                                        # not a pattern, and `*.zip` is not this
                                        # action's to expand
        IFS=' '
        # shellcheck disable=SC2086
        set -- "$@" $EXTRA
        case $PATHS in
          *"$newline"*) IFS=$newline ;;
          *)            IFS=' ' ;;
        esac
        # shellcheck disable=SC2086
        set -- "$@" $PATHS
        IFS=$old_ifs
        set +f

        # `|| rc=$?`, not a bare call followed by `$?`. GitHub runs `shell: bash`
        # as `bash --noprofile --norc -e -o pipefail`, so errexit is already on
        # before this script says anything: a bare call that exits non-zero ends
        # the step *there*, and everything below -- the output, the branch, the
        # message -- never happens. That is what shipped an hour ago, and it read
        # as "a failed step publishes no outputs" because the output was never
        # written. `set -uo pipefail` above does not turn `-e` off, and this line
        # is why it does not need to.
        rc=0
        "$@" || rc=$?

        # Only the codes this tool defines are verdicts. 127 is "no python here",
        # 126 is "not executable"; reported as a verdict they would say a
        # container has a finding when nothing looked at one -- and in report
        # mode the step would go green over a run that never happened.
        case "$rc" in
          0|1|2|3|64) ;;
          *)
            echo "::error::the checker did not run (exit $rc); this is not a verdict on any container"
            exit "$rc"
            ;;
        esac
        echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
        echo "pyz=$PYZ" >> "$GITHUB_OUTPUT"
        # Written before either branch, because it is the only place the code
        # exists: on the failing branch GitHub discards this action's outputs,
        # and the line above is then what the log has and the job does not.
        # `tr`, not bash 4's `${x,,}`: macOS runners still ship bash 3.2.
        if [ "$(printf '%s' "$FAIL_ON_FINDING" | tr '[:upper:]' '[:lower:]')" = "false" ]; then
          echo "vdi2770-validate returned $rc; the step is not failing because fail-on-finding is false"
          exit 0
        fi
        # The code, not a flattened failure: a job that cannot tell 64 from 1
        # cannot tell its own typo from somebody's bad container.
        exit "$rc"
