<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 396" role="img" aria-label="Real vdi2770-validate output on a container that ships in this repository: error F1, a file named in the metadata is not in the container, with the line it is declared on and how to fix it; error Z7, the documentation container has no VDI2770_Main.pdf, with its remedy">
<rect x="1" y="1" width="938" height="394" rx="10" fill="#12161a" stroke="#252b30" stroke-width="1.5"/>
<circle cx="24" cy="19" r="5" fill="#e0604d"/><circle cx="42" cy="19" r="5" fill="#e8c268"/><circle cx="60" cy="19" r="5" fill="#5cb87f"/>
<text x="80" y="23" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#7d8a99">vdi2770-validate — real output, colour added</text>
<text y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="28" fill="#8fd0a8" font-weight="700">$ </tspan><tspan x="46" fill="#d8dfe5">pip install vdi2770-validate</tspan></text><text y="61" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="28" fill="#8fd0a8" font-weight="700">$ </tspan><tspan x="46" fill="#d8dfe5">vdi2770-validate check corpus/examples/missingdocuments/folders.zip</tspan></text><text y="91" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="28" fill="#d8dfe5" font-weight="700">folders.zip</tspan></text><text y="115" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="46" fill="#e0604d" font-weight="700">error </tspan><tspan x="104" fill="#e8c268" font-weight="700">F1 </tspan><tspan x="150" fill="#d8dfe5">A file named in the metadata is not in the container</tspan></text><text y="134" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="150" fill="#93a1ad">at </tspan><tspan x="172" fill="#7d8a99">folders.zip!/VDI2770_Main.xml:56:2</tspan></text><text y="151" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="150" fill="#7d8a99">'VDI2770_Main.pdf' is declared but not in the archive</tspan></text><text y="170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="150" fill="#5cb87f">-&gt; Add the missing file to the container, or remove its DigitalFile entry</tspan></text><text y="187" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="172" fill="#5cb87f">from the metadata. The two must agree.</tspan></text><text y="213" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="46" fill="#e0604d" font-weight="700">error </tspan><tspan x="104" fill="#e8c268" font-weight="700">Z7 </tspan><tspan x="150" fill="#d8dfe5">The documentation container has no VDI2770_Main.pdf</tspan></text><text y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="150" fill="#93a1ad">at </tspan><tspan x="172" fill="#7d8a99">folders.zip</tspan></text><text y="251" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="150" fill="#5cb87f">-&gt; Add the main document as VDI2770_Main.pdf at the root of the</tspan></text><text y="268" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="172" fill="#5cb87f">documentation container, next to VDI2770_Main.xml.</tspan></text><text y="296" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="46" fill="#7d8a99">… 1 more error (Z13) and 1 warning (Z9)</tspan></text><text y="326" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="28" fill="#d8dfe5" font-weight="700">3 error(s), 1 warning(s), 0 note(s) </tspan><tspan x="292" fill="#93a1ad">— 1 of the errors is this tool</tspan></text><text y="343" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="292" fill="#93a1ad">declining to look, not the container</tspan></text><text y="364" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="28" fill="#93a1ad">read 1 of 1 archives, 1 of 3 metadata files</tspan></text>
</svg>