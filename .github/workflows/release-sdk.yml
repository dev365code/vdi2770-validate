name: release-sdk

# Publishes the reader library `vdi2770` on an `sdk-v*` tag. Separate file and
# separate environment from release.yml on purpose -- see the note there.

on:
  push:
    tags: ["sdk-v*"]

defaults:
  run:
    working-directory: packages/vdi2770

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"
      # The whole gate, not the library's half. The reason to split the package
      # was not to split the evidence: the rule set is the largest consumer of
      # this library, and a reader change that moves a verdict has to fail here
      # rather than downstream. This step used to run two of the nine targets there were then and
      # never ran `tools/api_fingerprint.py` -- the gate whose entire purpose is
      # to stop this workflow publishing a reader whose API has moved.
      - name: The whole gate must pass on the tagged tree
        # `working-directory: .` is load-bearing: this file sets a default of
        # `packages/vdi2770` for every step, so without it these run from inside
        # the library and there is no Makefile there. The step that this replaced
        # carried the same line; dropping it made the SDK release fail before it
        # could publish anything.
        working-directory: .
        run: |
          python -m pip install -e packages/vdi2770
          python -m pip install -e ".[dev]"
          make check
      # And the sweep must be complete. `make check` reads our half of it; this
      # asks whether the reference has ever seen every container. A release
      # publishes the divergence counts, and those exclude anything unswept.
      - name: Every container has been through the reference implementation
        working-directory: .
        run: make oracle-fully-swept
      - name: The tag must be the version
        run: |
          tag="${GITHUB_REF_NAME#sdk-v}"
          pkg=$(python -c "import sys; sys.path.insert(0,'src'); import vdi2770; print(vdi2770.__version__)")
          test "$tag" = "$pkg" || { echo "tag $tag != package $pkg"; exit 1; }
      - name: Build
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdk
          path: packages/vdi2770/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-vdi2770
    permissions:
      id-token: write        # Trusted Publishing; no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-sdk
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
