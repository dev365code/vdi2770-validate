name: release-sdk

# Publishes the reader library `vdi2770` on an `sdk-v*` tag. Separate file and
# separate environment from release.yml on purpose -- see the note there.

on:
  push:
    tags: ["sdk-v*"]

defaults:
  run:
    working-directory: packages/vdi2770

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"
      - name: The library's own gate must pass on the tagged tree
        run: |
          python -m ruff check src tests
          python -m pytest
      - name: And so must the validator's, against this exact tree
        # The reason to split the package was not to split the evidence: the rule
        # set is the largest consumer of this library, and a reader change that
        # moves a verdict has to fail here rather than downstream.
        working-directory: .
        run: |
          python -m pip install -e ".[dev]"
          python tools/make_fixtures.py
          python -m pytest
      - name: The tag must be the version
        run: |
          tag="${GITHUB_REF_NAME#sdk-v}"
          pkg=$(python -c "import sys; sys.path.insert(0,'src'); import vdi2770; print(vdi2770.__version__)")
          test "$tag" = "$pkg" || { echo "tag $tag != package $pkg"; exit 1; }
      - name: Build
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdk
          path: packages/vdi2770/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-vdi2770
    permissions:
      id-token: write        # Trusted Publishing; no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-sdk
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
