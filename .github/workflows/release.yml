name: release

# Two distributions ship from this repository, and PyPI keys a trusted publisher
# on (repo, workflow file, environment). Two publishers sharing that tuple would
# each be able to publish as the other, so the environments differ: a job running
# in `pypi-vdi2770` gets an OIDC token that names it, and the other project's
# publisher will not accept it.
#
# They are one workflow file because they are one release. `vdi2770` is the
# reader and `vdi2770-validate` is the rule set built on it; they carry the same
# version, go out under one tag, and the second pins the first exactly. That pin
# is an ordering: publish the rules first and the index holds a distribution pip
# cannot resolve, under a number PyPI will not let anyone reuse. `needs:` states
# that ordering and the runner enforces it; two workflows on two tags cannot say
# it at all, which is why this used to be two files on `v*` and `sdk-v*` and is
# not any more.

on:
  push:
    tags: ["v*"]

jobs:
  # The reader goes first, and the whole gate runs here — before anything at all
  # has been published, which is the only moment a refusal is still free.
  build-reader:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` is load-bearing: three release-time assertions read
      # the tag history, and without it they take their degraded branch or
      # skip — in the one workflow that authorises a publish.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          # The reader first, from the working tree. The rules pin it exactly,
          # and this commit's reader is the only thing that satisfies that pin
          # before the release exists — going to an index here would run the
          # gate against a reader nobody is publishing.
          python -m pip install -e packages/vdi2770
          python -m pip install -e ".[dev]"
      # `make check`, not a copy of what it runs. The copy went stale the moment
      # the gate grew: this step listed six of nine targets, and the three it
      # missed were the three newest -- including the one that stops the reader
      # shipping a moved API under an old version, which is a release concern
      # before it is anything else.
      - name: The gate must pass on the tagged tree
        run: make check
      # And the sweep must be complete. `make check` reads our half of it; this
      # asks whether the reference has ever seen every container. A release
      # publishes the divergence counts, and those exclude anything unswept.
      - name: Every container has been through the reference implementation
        run: make oracle-fully-swept
      # A forced tag update fires this workflow exactly as a new tag does, so a
      # re-pointed tag would carry a days-old tree through the gate and then ask
      # the index to accept a filename it already holds. Ask first.
      - name: The index must not already have this version
        run: python tools/check_version_is_new.py --package vdi2770 --version "${GITHUB_REF_NAME#v}"
      - name: The tag must be the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import sys; sys.path.insert(0,'packages/vdi2770/src'); import vdi2770 as v; print(v.__version__)")
          test "$tag" = "$pkg" || { echo "tag $tag != package $pkg"; exit 1; }
      - name: Build
        run: python -m build packages/vdi2770 --outdir dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-reader
          path: dist/

  publish-reader:
    needs: build-reader
    runs-on: ubuntu-latest
    environment: pypi-vdi2770
    permissions:
      id-token: write        # Trusted Publishing; no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-reader
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The rules, published only once the reader they pin is installable.
  build-rules:
    needs: publish-reader
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` again, for a different reason: the order gate below
      # asks the tag history whether the reader this pins was released,
      # and a default checkout is `--depth 1 --no-tags`.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip build packaging
      # The question this whole job order exists for, asked rather than assumed.
      # `needs: publish-reader` proves the upload step ran; it does not prove the
      # index serves the file, and the rules are unresolvable until it does.
      # PyPI's JSON view can trail the upload by a few seconds, so the gate is
      # given a few tries -- and still refuses at the end rather than guessing,
      # because rules published against a reader that is not there cannot be
      # fixed under this version number.
      - name: The reader this pins must be on the index
        run: |
          for attempt in 1 2 3 4 5; do
            if python tools/check_release_order.py; then exit 0; fi
            echo "the index does not serve it yet (attempt $attempt of 5); waiting"
            sleep 20
          done
          echo "the reader this pins never appeared on the index"
          exit 1
      - name: The index must not already have this version
        run: python tools/check_version_is_new.py --package vdi2770-validate --version "${GITHUB_REF_NAME#v}"
      - name: The tag must be the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import sys; sys.path.insert(0,'src'); import vdi2770_validate as v; print(v.__version__)")
          test "$tag" = "$pkg" || { echo "tag $tag != package $pkg"; exit 1; }
      - name: Build
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-rules
          path: dist/

  publish-rules:
    needs: build-rules
    runs-on: ubuntu-latest
    # Not the reader's environment. The environment is half of what PyPI keys
    # the publisher on, so sharing it would let either job publish as the other
    # package.
    environment: pypi-vdi2770-validate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-rules
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
