name: release

# Two distributions ship from this repository, and PyPI keys a trusted publisher
# on (repo, workflow file, environment). Two publishers sharing that tuple would
# each be able to publish as the other, so the environments differ: a job running
# in `pypi-vdi2770` gets an OIDC token that names it, and the other project's
# publisher will not accept it.
#
# They are one workflow file because they are one release. `vdi2770` is the
# reader and `vdi2770-validate` is the rule set built on it; they carry the same
# version, go out under one tag, and the second pins the first exactly. That pin
# is an ordering: publish the rules first and the index holds a distribution pip
# cannot resolve, under a number PyPI will not let anyone reuse. `needs:` states
# that ordering and the runner enforces it; two workflows on two tags cannot say
# it at all, which is why this used to be two files on `v*` and `sdk-v*` and is
# not any more.

# The floor, written here rather than left to a repository setting. Measured,
# this repository's default is `read` -- but a default is a thing somebody can
# change without touching this file, and two of the jobs below hold a token that
# publishes. A job that needs more says so; a job that says nothing gets this.
permissions:
  contents: read

on:
  push:
    tags: ["v*"]

# **If the engine is published and the alias is not.** PyPI does not release a
# version number, so the repair is to finish the release rather than to redo it.
# Use *Re-run failed jobs*, never *Re-run all jobs*: the first leaves
# `build-reader` alone, and the second re-runs it into `check_version_is_new.py
# --package vdi2770`, which now correctly refuses because the engine is on the
# index — the job that produces the alias could then never run again under this
# number.
#
# The jobs that can run after a partial release are shaped for it.
# `reader-is-on-the-index` reads and waits and holds no token, and
# `publish-rules` downloads and uploads and does nothing else, so re-running
# either repeats no decision. Neither can publish the engine a second time:
# `publish-reader` is not downstream of them.
#
# If the alias cannot be published at all — the wheel is wrong rather than the
# upload — then the engine at that number stands and the alias goes out at the
# next one. The alias floors on the engine's version, so an alias 0.8.1 asking
# for `vdi2770[validate]>=0.8.1` would need an engine to match: bump both and
# tag again. What must never happen is the reverse, an alias on the index
# without its engine, which is why the order is what it is.

jobs:
  # The reader goes first, and the whole gate runs here — before anything at all
  # has been published, which is the only moment a refusal is still free.
  build-reader:
    runs-on: ubuntu-latest
    permissions:
      # Only to ask whether CI judged this commit. The default token can read
      # the repository; run history is a separate scope, and without it the gate
      # below refuses rather than passing -- which is the behaviour that makes
      # granting it a decision rather than a formality.
      actions: read
      contents: read
    steps:
      # `fetch-depth: 0` is load-bearing: three release-time assertions read
      # the tag history, and without it they take their degraded branch or
      # skip — in the one workflow that authorises a publish.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          # The reader first, from the working tree. The rules pin it exactly,
          # and this commit's reader is the only thing that satisfies that pin
          # before the release exists — going to an index here would run the
          # gate against a reader nobody is publishing.
          python -m pip install -e packages/vdi2770
          python -m pip install -e ".[dev]"
      # `make check`, not a copy of what it runs. The copy went stale the moment
      # the gate grew: this step listed six of nine targets, and the three it
      # missed were the three newest -- including the one that stops the reader
      # shipping a moved API under an old version, which is a release concern
      # before it is anything else.
      # `make check` below is one interpreter on one Linux runner. The matrix
      # that answers for three Pythons and for Windows runs on push, and until
      # now nothing connected the two: a tag could be pushed at a moment when
      # the branch run never finished, was cancelled, or failed. A cancelled run
      # is the case worth naming -- not a failure and not a pass, a commit
      # nobody judged, rendered as a grey dot rather than a red one.
      - name: CI must have judged this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/check_ci_judged_this_commit.py --commit "$GITHUB_SHA"
      - name: The gate must pass on the tagged tree
        run: make check
      # And the sweep must be complete. `make check` reads our half of it; this
      # asks whether the reference has ever seen every container. A release
      # publishes the divergence counts, and those exclude anything unswept.
      - name: Every container has been through the reference implementation
        run: make oracle-fully-swept
      # A forced tag update fires this workflow exactly as a new tag does, so a
      # re-pointed tag would carry a days-old tree through the gate and then ask
      # the index to accept a filename it already holds. Ask first.
      - name: The index must not already have this version
        run: python tools/check_version_is_new.py --package vdi2770 --version "${GITHUB_REF_NAME#v}"
      # A script, and one that imports nothing. This was a line that read the
      # version by importing the package, in a job that installs `build` and
      # `packaging` and nothing else -- and after the merge the alias's
      # `__init__` imports the engine, so the import raised, the substitution
      # produced the empty string, and every tag failed with *tag != package*.
      # Nothing had ever run it.
      - name: The tag must be the version
        run: python tools/check_tag_is_the_version.py --tag "${GITHUB_REF_NAME#v}" --project packages/vdi2770
      - name: Build
        run: python -m build packages/vdi2770 --outdir dist/
      # Recorded outside `dist/`. The publish action uploads everything it
      # finds in that directory, so a checksum file left there would be
      # offered to PyPI as part of the release.
      - name: Record what was built
        run: |
          mkdir -p sums
          (cd dist && sha256sum *) | tee sums/SHA256SUMS
          # A build that produced nothing leaves an empty list, and an empty
          # list is what every check below would then agree with. `python -m
          # build` makes an sdist and a wheel, so two is the floor.
          test "$(wc -l < sums/SHA256SUMS)" -ge 2 || {
            echo "recorded $(wc -l < sums/SHA256SUMS) files; the build produced nothing"
            exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sums-reader
          path: sums/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist-reader
          path: dist/

  publish-reader:
    needs: upgrade-gate
    runs-on: ubuntu-latest
    environment: pypi-vdi2770
    permissions:
      id-token: write        # Trusted Publishing; no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist-reader
          path: dist/
      # The bytes, not the name. An artifact is immutable and fetched by
      # name, so this cannot fail without something having gone very wrong --
      # which is the point: it is the line that turns "the gate tested these
      # wheels" from an argument about the job graph into a checked fact, and
      # it is what an independent verifier compares against afterwards.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: sums-reader
          path: sums/
      - name: These are the bytes that were built and tested
        run: |
          cat sums/SHA256SUMS
          # Counted first: `sha256sum -c` over an empty list exits 0 on at
          # least one coreutils, and this is the last thing that runs before an
          # upload that cannot be taken back.
          n="$(wc -l < sums/SHA256SUMS)"
          test "$n" -ge 2 || { echo "only $n files recorded"; exit 1; }
          (cd dist && sha256sum -c ../sums/SHA256SUMS)
          test "$(ls dist | wc -l)" -eq "$n" || {
            echo "dist/ holds $(ls dist | wc -l) files and $n were recorded; "
            echo "PyPI would receive something no build job made"
            exit 1; }
      # Pinned to a commit, not to `release/v1`. This is the one thing in this
      # job that is not ours, and it runs while the job holds `id-token: write`
      # for a real distribution: a moving ref means whatever that ref points at
      # on the day can mint a publishing token. v1.14.2.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  # The rules are built before anything is published. Building does not resolve
  # runtime dependencies, so this never needed the reader to be on an index --
  # and holding it until after the first upload put a build, a version check and
  # the whole upgrade matrix inside the window between the two publishes. The
  # question that does need the reader published has moved to its own job.
  build-rules:
    needs: build-reader
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` still: the tag-is-version check below reads the tag,
      # and a default checkout is `--depth 1 --no-tags`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip build packaging
      - name: The index must not already have this version
        run: python tools/check_version_is_new.py --package vdi2770-validate --version "${GITHUB_REF_NAME#v}"
      - name: The tag must be the version
        run: python tools/check_tag_is_the_version.py --tag "${GITHUB_REF_NAME#v}" --project .
      - name: Build
        run: python -m build --outdir dist/
      # Recorded outside `dist/`. The publish action uploads everything it
      # finds in that directory, so a checksum file left there would be
      # offered to PyPI as part of the release.
      - name: Record what was built
        run: |
          mkdir -p sums
          (cd dist && sha256sum *) | tee sums/SHA256SUMS
          # A build that produced nothing leaves an empty list, and an empty
          # list is what every check below would then agree with. `python -m
          # build` makes an sdist and a wheel, so two is the floor.
          test "$(wc -l < sums/SHA256SUMS)" -ge 2 || {
            echo "recorded $(wc -l < sums/SHA256SUMS) files; the build produced nothing"
            exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sums-rules
          path: sums/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist-rules
          path: dist/

  # The last thing before the name people type gets a new version behind it.
  # It installs what is on the index today and then upgrades to the wheel that
  # is about to replace it, and the verdict is that the command still runs --
  # `pip check` calls a destroyed install healthy, so it is recorded and not
  # believed. This cannot protect the reader's publish, which has already
  # happened by the time both wheels exist; it protects the one people install
  # by name, which is where every upgrade failure here has been.
  upgrade-gate:
    needs: [build-reader, build-rules]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # Both wheels, into one directory. It downloaded only the rules, and every
      # case from the fourth onward installs with `--no-index --find-links` and
      # asks for the engine -- directly, or as the alias's own dependency. The
      # engine's wheel was not there, so pip could not resolve and the gate
      # standing between the two publishes was red on any tag. Nothing noticed:
      # locally `make` builds both into one directory, so it only failed where
      # no one had run it.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist-reader
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist-rules
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: sums-reader
          path: sums-reader/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: sums-rules
          path: sums-rules/
      - name: These are the bytes the build jobs made
        run: |
          cat sums-reader/SHA256SUMS sums-rules/SHA256SUMS > /tmp/SHA256SUMS
          # Counted before it is checked. `sha256sum -c` over a list with no
          # entries is a check that agrees with everything -- measured, exit 0 --
          # and whether it happens to refuse depends on which coreutils is
          # installed. A gate must not rest on that.
          n="$(wc -l < /tmp/SHA256SUMS)"
          test "$n" -ge 4 || { echo "only $n files recorded for two builds"; exit 1; }
          (cd dist && sha256sum -c /tmp/SHA256SUMS)
          test "$(ls dist | wc -l)" -eq "$n" || {
            echo "dist/ holds $(ls dist | wc -l) files and $n were recorded; "
            echo "something is here that no build job made"
            exit 1; }
      - name: Both wheels are here, or the gate is checking half a release
        run: |
          ls -l dist/
          test -n "$(ls dist/vdi2770-*.whl 2>/dev/null)" || {
            echo "no engine wheel in dist/; every case that installs would fail"
            exit 1; }
          test -n "$(ls dist/vdi2770_validate-*.whl 2>/dev/null)" || {
            echo "no alias wheel in dist/"; exit 1; }
      # Before either publish, so it protects both. The first three cases
      # install from the live index with no `--find-links`, which before this
      # ran against an index already holding the new engine. It no longer does,
      # and that is the right way round: if a new engine broke an old alias, the
      # remedy is to publish the matched pair, not to withhold it and leave
      # everyone in the mixed state. The window itself is measured by the case
      # that simulates it.
      - name: An install somebody already has must survive this release
        run: python tools/check_upgrade_paths.py --from dist
      # The single file, built here rather than by hand. The front page points
      # at `releases/latest/download/vdi2770.pyz`, and that URL resolves against
      # whichever release is newest -- so a release without it does not merely
      # lack an asset, it breaks a link on the front page the moment it exists.
      # For 0.8.0 somebody built it and remembered to attach it. That is the
      # arrangement that works until the day nobody does.
      #
      # Here rather than in a publishing job: this one already has the tree and
      # the network, and a job holding a token that publishes should run as
      # little as it can. The builder refuses on its own if the bundle names the
      # machine that made it.
      - name: Build the single file
        run: |
          python tools/build_zipapp.py --check -o pyz/vdi2770.pyz
          (cd pyz && sha256sum vdi2770.pyz | tee SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist-single-file
          path: pyz/

  # The only thing between the two uploads. It holds the workflow's floor --
  # `contents: read`, nothing else -- and no environment. (It said "no token",
  # which is not a thing a job can have: absent a `permissions:` block it takes
  # whatever the repository's default is, and that is a setting, not a fact
  # about this file.) Two reasons it is its own job rather than a step inside the
  # publisher. A job that publishes should be download-and-upload and nothing
  # else, so that re-running it after a failure is one click and repeats no
  # decision -- which is the whole of the recovery path when the engine is on
  # the index and the alias is not. And a `pip install` from PyPI, a `git`
  # subprocess and a script from the tagged tree do not belong in the job that
  # holds `id-token: write` for a distribution.
  reader-is-on-the-index:
    needs: publish-reader
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0`: the gate asks the tag history whether this release is
      # tagged, and a default checkout is `--depth 1 --no-tags`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip packaging
      # `needs: publish-reader` proves the upload step ran. It does not prove
      # the index serves the file, and the alias is unresolvable until it does.
      # PyPI's JSON view can trail the upload, so this is given a few tries --
      # and refuses at the end rather than guessing, because an alias published
      # against an engine that is not there cannot be fixed under this version
      # number.
      # The waits grow. A hundred seconds was not enough on the release this
      # step was written for: the JSON view listed the engine and the file
      # index had not caught up, and the job failed with the alias unpublished.
      # Waiting is cheap and a half-finished release is not, so the patience is
      # bounded but generous, and the numbers live here rather than in prose.
      - name: The engine this floors on must be on the index
        run: |
          # One invocation, and the first wait is zero. Written the other way --
          # a loop plus a last attempt after it -- the command appears twice,
          # and killing one of them leaves the other: the row that proves this
          # step still runs the gate survived exactly that way.
          for wait in 0 20 30 45 60 90 120; do
            [ "$wait" -gt 0 ] && { echo "not yet; waiting ${wait}s"; sleep "$wait"; }
            if python tools/check_release_order.py; then exit 0; fi
          done
          echo "the engine this floors on never appeared on the index"
          exit 1
      # And "the JSON view lists it" is not "a machine can install it". This is
      # the state the alias actually requires, so it is the one that is asked
      # for before the alias goes out.
      - name: And a machine can actually install it
        run: |
          version="${GITHUB_REF_NAME#v}"
          for wait in 0 20 30 45 60 90 120; do
            [ "$wait" -gt 0 ] && { echo "not yet; waiting ${wait}s"; sleep "$wait"; }
            if python -m pip download --no-deps --only-binary :all: \
                 --dest /tmp/probe "vdi2770==$version"; then exit 0; fi
          done
          echo "vdi2770 $version is listed and cannot be installed"
          exit 1

  # After both are on the index, ask the whole matrix again -- this time about
  # the world as it now is.
  #
  # The rows that consult the index are correct until the publish and can be
  # wrong after it: one of them asserted the shape of requirement this release
  # retired, and another built its "before" state with a bare `pip install`,
  # which stops naming the older release the moment a newer one exists. Both
  # went stale on publication, and the first thing that noticed was the next
  # push to `main` -- a red badge on a repository whose release had just
  # succeeded.
  #
  # The matrix that runs before the publish cannot see this: it asks about an
  # index that does not yet hold this release. This job publishes nothing and
  # holds no token; it can only report, and a failure here is a repair to make
  # rather than a release to take back.
  the-index-as-it-now-is:
    needs: publish-rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e packages/vdi2770
          python -m pip install -e ".[dev]"
      # PyPI's file index can trail its JSON view, and the job before this one
      # waited for the engine rather than the alias. Ask for the alias the way
      # a person would, and give it the same bounded patience.
      - name: Both halves are installable
        run: |
          version="${GITHUB_REF_NAME#v}"
          for wait in 0 20 30 45 60 90 120; do
            [ "$wait" -gt 0 ] && { echo "not yet; waiting ${wait}s"; sleep "$wait"; }
            if python -m pip download --no-deps --only-binary :all: \
                 --dest /tmp/both "vdi2770==$version" \
                 "vdi2770-validate==$version"; then exit 0; fi
          done
          echo "the release is on the index and cannot both be installed"
          exit 1
      - name: The matrix, against the index this release just changed
        run: |
          rm -rf dist
          python -m build packages/vdi2770 --outdir dist/
          python -m build --outdir dist/
          python tools/check_upgrade_paths.py --from dist

  publish-rules:
    needs: [reader-is-on-the-index, upgrade-gate]
    runs-on: ubuntu-latest
    # Not the reader's environment. The environment is half of what PyPI keys
    # the publisher on, so sharing it would let either job publish as the other
    # package.
    environment: pypi-vdi2770-validate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist-rules
          path: dist/
      # The bytes, not the name. An artifact is immutable and fetched by
      # name, so this cannot fail without something having gone very wrong --
      # which is the point: it is the line that turns "the gate tested these
      # wheels" from an argument about the job graph into a checked fact, and
      # it is what an independent verifier compares against afterwards.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: sums-rules
          path: sums/
      - name: These are the bytes that were built and tested
        run: |
          cat sums/SHA256SUMS
          # Counted first: `sha256sum -c` over an empty list exits 0 on at
          # least one coreutils, and this is the last thing that runs before an
          # upload that cannot be taken back.
          n="$(wc -l < sums/SHA256SUMS)"
          test "$n" -ge 2 || { echo "only $n files recorded"; exit 1; }
          (cd dist && sha256sum -c ../sums/SHA256SUMS)
          test "$(ls dist | wc -l)" -eq "$n" || {
            echo "dist/ holds $(ls dist | wc -l) files and $n were recorded; "
            echo "PyPI would receive something no build job made"
            exit 1; }
      # Pinned to a commit, not to `release/v1`. This is the one thing in this
      # job that is not ours, and it runs while the job holds `id-token: write`
      # for a real distribution: a moving ref means whatever that ref points at
      # on the day can mint a publishing token. v1.14.2.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
