name: release

# Two packages ship from this repository, so each gets its own workflow file and
# its own environment: PyPI keys a trusted publisher on (repo, workflow, environment),
# and two packages sharing that tuple would each be able to publish as the other.
# This one publishes `vdi2770-validate` on a `v*` tag; release-sdk.yml publishes
# `vdi2770` on an `sdk-v*` tag, which `v*` deliberately does not match.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` is load-bearing: three release-time assertions read
      # the tag history, and without it they take their degraded branch or
      # skip — in the one workflow that authorises a publish.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e packages/vdi2770
          python -m pip install -e ".[dev]"
      # `make check`, not a copy of what it runs. The copy went stale the moment
      # the gate grew: this step listed six of nine targets, and the three it
      # missed were the three newest -- including the one that stops the reader
      # shipping a moved API under an old version, which is a release concern
      # before it is anything else.
      - name: The gate must pass on the tagged tree
        run: make check
      # And the sweep must be complete. `make check` reads our half of it; this
      # asks whether the reference has ever seen every container. A release
      # publishes the divergence counts, and those exclude anything unswept.
      - name: Every container has been through the reference implementation
        run: make oracle-fully-swept
      # And the reader it pins must already be on the index. `pip install -e
      # packages/vdi2770` satisfies the pin from the working tree, so nothing in
      # the gate ever asks; `python -m build` does not resolve runtime
      # dependencies at all. Tagging this before `sdk-v*` publishes a
      # distribution pip cannot resolve, under a number PyPI will not let anyone
      # reuse. The constraint lived in a docstring until it had this step.
      - name: The reader this pins must already have been released
        run: python tools/check_release_order.py
      # A forced tag update fires this workflow exactly as a new tag does, so a
      # re-pointed tag would carry a days-old tree through the gate and then ask
      # the index to accept a filename it already holds. Ask first.
      - name: The index must not already have this version
        run: python tools/check_version_is_new.py --package vdi2770-validate --version "${GITHUB_REF_NAME#v}"
      - name: The tag must be the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import sys; sys.path.insert(0,'src'); import vdi2770_validate as v; print(v.__version__)")
          test "$tag" = "$pkg" || { echo "tag $tag != package $pkg"; exit 1; }
      - name: Build
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # Trusted Publishing; no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
