name: check

on:
  push:
    # `wip/**` as well as main, because the Windows row runs nowhere else.
    # Twice in one night a defect reached main that no branch check could have
    # caught: a media-type table narrower than the Windows registry, and a test
    # label built with the platform's path separator. Both were green on macOS
    # and on three Linux rows, on the branch, under review, and red the moment
    # they merged -- because a branch never saw the only reader that disagreed.
    # A gate that cannot run before the merge is not a gate on the merge.
    # `release/**` too. A patch branch is where a security fix lives before
    # it is tagged, and it was getting less than a scratch branch: the push
    # trigger did not name it, so pushing one started nothing, and the
    # release workflow runs every job on ubuntu -- so a fix could have gone
    # out without the Windows row ever seeing it. The reason `wip/**` is
    # here is the reason this belongs here more.
    branches: [main, 'wip/**', 'release/**']
  pull_request:
  # Also on demand: a platform-specific fix or a change to the test matrix can
  # be run against a branch before it lands, the way the release workflow's dry
  # run rehearses a publish.
  workflow_dispatch:

# A branch under active work is pushed repeatedly, and only the last push is
# worth six jobs. This cancels the previous run of the same ref rather than
# queueing behind it; `main` is a ref like any other here, and a superseded run
# of main is a run of a commit that is no longer the tip.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One Windows row beside the three Linux ones, on the interpreter in the
  # middle of the supported range.
  #
  # Not for breadth. The gate that decides whether an import was declared reads
  # where a module actually loads from, and Windows keeps the extension modules
  # in `<base_prefix>\DLLs` -- a *sibling* of `Lib` rather than a child, so
  # `unicodedata` is not under the directory `sysconfig` calls `stdlib`. No
  # runner here could have shown that: on this project's own interpreters
  # `lib-dynload` sits under it. A sister project's Windows row found it, and
  # the repair had to be taken on trust.
  #
  # And this release moves console scripts and entry points, which is the part
  # of packaging that differs most between platforms: a script is a shim
  # executable there and a shebang file here, and `pip` writes both from the
  # same `entry_points.txt`.
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      # `fail-fast` off: one platform failing while the other is still running
      # tells you less than both answers do, and the question here is often
      # which of the two is wrong.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The release workflows got this and this one did not, so the two
          # assertions that compare the tree against `sdk-v*` skipped on every
          # pull request -- silently, which is the only way a gate fails that
          # nobody notices. A default checkout is `--depth 1 --no-tags`.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The reader first, and from the working tree. The rules pin it
          # exactly, so a pip that reaches an index here would either fail (the
          # version is not published yet) or install a reader that is not the
          # one in this commit -- and the run would be about that instead.
          python -m pip install -e packages/vdi2770
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check --no-cache src tests tools packages
      - name: Build fixtures
        run: python tools/make_fixtures.py
      # The whole suite runs on every row, Windows included. A few tests skip on
      # Windows -- each a POSIX-only primitive or a fixture the platform cannot
      # build, not a gap in the tool: `os.mkfifo` and `/dev/stdin`, the SIGPIPE a
      # closed pipe raises, the Linux-only ci-judged gate's `gh` stub, a `zip(1)`
      # the runner may lack, and a member name carrying a backslash (`zipfile`
      # rewrites it to `/` there; the refusal itself is checked on every
      # platform). Each skip says why, at its own `skipif`.
      - name: Test
        run: python -m pytest
      # The question no reading of a tree can answer: does the file pip wrote
      # start, on the machine it wrote it on. This release moves where the tool
      # is installed from and which distribution owns the executable, and this
      # suite had never run on Windows -- where that file is `vdi2770-validate.exe`
      # and this harness used to answer "not installed at all" about it. Case 13
      # is every door on a working install; case 11 is the refusal, which has to
      # be exit 3 and not the exit 1 that means a container has findings.
      - name: The wheels install and run on this platform
        if: runner.os == 'Windows'
        run: |
          python -m pip install build
          python -m build packages/vdi2770 --outdir dist/
          python -m build --outdir dist/
          python tools/check_upgrade_paths.py --case 11 --case 13 --from dist

      - name: Corpus is unchanged
        if: runner.os != 'Windows'
        run: python tools/vendor_corpus.py --check
      - name: Firing coverage
        if: runner.os != 'Windows'
        run: python tools/rule_coverage.py --check
      - name: The rule reference matches the catalogue
        if: runner.os != 'Windows'
        run: python tools/rules_doc.py --check
      # On Windows too: its budget was measured there rather than borrowed, which
      # is the only way one means anything. The step is cheap -- five passes over
      # the corpus and a yardstick -- and it is the platform whose file I/O is
      # least like everybody else's.
      - name: The whole report is the one that is stored
        if: runner.os != 'Windows'
        run: python tools/golden_report.py --check
      - name: The corpus still costs what it cost
        run: python tools/time_budget.py --check
      - name: Our half of the oracle sweep is current
        if: runner.os != 'Windows'
        run: python tools/capture_oracle.py --check-ours
      - name: The reader's API matches its version
        if: runner.os != 'Windows'
        run: python tools/api_fingerprint.py --check
      # Built and *run*, not built. A single file that imports and cannot answer
      # is the failure this catches, and the two look alike from outside.
      - name: No two distributions claim one path
        # Compared against what the index already serves, not only against this
        # tree: the destruction happens between a release and whatever an
        # installation already has.
        # Ubuntu only -- the wheels are pure Python and identical either way,
        # and this one talks to the index.
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: python tools/check_paths_are_disjoint.py
      # The release runs this against the wheels it is about to publish, and
      # its copy was red from the merge until somebody read it: the job
      # downloaded one of the two wheels the matrix needs. A gate first
      # exercised by the event it guards is not a gate, so the same question is
      # asked here, on the wheels this commit builds.
      - name: An install somebody already has survives these wheels
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          rm -rf dist
          python -m build packages/vdi2770 --outdir dist/
          python -m build --outdir dist/
          python tools/check_upgrade_paths.py --from dist
      - name: The single file builds and checks a container
        if: runner.os != 'Windows'
        run: python tools/build_zipapp.py --check
      - name: The sdist can run its own tests
        if: runner.os != 'Windows'
        run: |
          python -m pip install build
          python tools/check_sdist.py
          python tools/check_wheel.py

  # The action this repository publishes, used the way somebody else would use
  # it. A composite action can be wrong in ways no unit test sees -- an input
  # that never reaches the command, a failure that does not fail the job -- and
  # the only way to find that out is to run it as a step.
  the-action-this-repo-offers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # No editable install: the builder reads the source tree, and a third
      # `pip install -e` here would make this workflow look like it builds its
      # distributions in three places.
      - name: Build the single file this working tree produces
        run: python tools/build_zipapp.py --check
      # The offline path: a file you already have, and nothing fetched.
      # `version` names a release that cannot exist, so if the install ever
      # stopped being skipped this step would go red instead of quietly reaching
      # an index. The promise is "given `pyz`, this action installs nothing"; a
      # test that reads the `if:` proves the text, and this proves the behaviour.
      - name: A conforming container passes, with nothing installed
        uses: ./
        with:
          pyz: dist/vdi2770.pyz
          version: "0.0.0-there-is-no-such-release"
          paths: corpus/examples/container/documentcontainer.zip
      - name: A container with a finding fails, and says so with its own code
        id: broken
        continue-on-error: true
        uses: ./
        with:
          pyz: dist/vdi2770.pyz
          paths: corpus/examples/empty.zip
      # Both directions, because an action that always failed would pass the
      # test above and an action that always passed would pass this one.
      - name: The failure was the checker's verdict, not the action falling over
        run: |
          test "${{ steps.broken.outcome }}" = failure || { echo "::error::a container with findings did not fail the step"; exit 1; }
          # Measured on 2026-09-19 and asserted since: a failed step does still
          # publish its outputs. It went in as an echo, because guessing at
          # somebody else's runtime is how the first version of this action got
          # written; the log answered, and the answer became a gate.
          test "${{ steps.broken.outputs.exit-code }}" = 1 || { echo "::error::a failed step no longer publishes exit-code; the docs say it does"; exit 1; }
      # The other mode, and the reason there are two: GitHub publishes no outputs
      # for a step it has decided failed, so the code above is in the log and not
      # in the job. Asked not to fail, the action succeeds and hands it over.
      - name: Asked not to fail, it reports the code instead
        id: reported
        uses: ./
        with:
          pyz: dist/vdi2770.pyz
          paths: corpus/examples/empty.zip
          fail-on-finding: "false"
      - name: The reported code is the checker's own
        run: |
          test "${{ steps.reported.outcome }}" = success || { echo "::error::fail-on-finding:false still failed the step"; exit 1; }
          test "${{ steps.reported.outputs.exit-code }}" = 1 || { echo "::error::expected exit 1 for a finding, got '${{ steps.reported.outputs.exit-code }}'"; exit 1; }
      # Which release? The newest the index serves, asked at run time.
      #
      # A number written here has to be hand-edited on every release, and until
      # somebody does it this job is red -- which is not a worry, it is what
      # happened: the first push after 0.9.0 went out failed here, because the
      # number still said 0.8.2. And four numbers can never be put back: 0.8.0,
      # 0.8.1, 0.8.2 and 0.9.0 ask for their engine with `>=`, so installing one
      # resolves a newer engine beside an older command and the tool refuses the
      # mismatch. Their metadata is published and cannot be recalled. (Releases
      # up to 0.7.0 name their own engine and still install and run -- they were
      # never the problem.) "The newest" is the answer that was true yesterday
      # and stays true tomorrow.
      #
      # One window remains, and it closes by itself: during this project's own
      # publish the engine reaches the index before the alias, and in that gap
      # "newest alias" is still the previous release, whose floor pulls the new
      # engine. A job that fails here during a release is re-run after it.
      - name: The newest release the index serves
        id: newest
        run: |
          # `|| { ... }`, not a test on the next line. This step runs under
          # `bash --noprofile --norc -e -o pipefail`, so a failed lookup ends the
          # step where it happens and anything after it never runs -- a message
          # written below the assignment is a message nobody ever reads. That
          # exact mistake was made once already in this repository's own action.
          v=$(python3 -c "import json,urllib.request as u;print(json.load(u.urlopen('https://pypi.org/pypi/vdi2770-validate/json'))['info']['version'])") || {
            echo "::error::could not ask the index which release is newest"; exit 1; }
          test -n "$v" || { echo "::error::the index named no version"; exit 1; }
          echo "asking for $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # The fetching path, against a release that exists. It proves the download
      # and the version input, which the offline path above deliberately skips.
      - name: A published release installs and runs
        id: installed
        uses: ./
        with:
          version: ${{ steps.newest.outputs.version }}
          paths: corpus/examples/container/documentcontainer.zip
      # Exiting 0 would also happen if the install resolved some *other* release,
      # which is precisely the failure this repository's two tag streams make
      # possible. So ask what ran what it is.
      - name: The version that ran is the one that was asked for
        env:
          WANT: ${{ steps.newest.outputs.version }}
        run: |
          test "${{ steps.installed.outputs.version }}" = "$WANT" || { echo "::error::asked for $WANT and the action resolved ${{ steps.installed.outputs.version }}"; exit 1; }
          got=$(PYTHONPATH="$RUNNER_TEMP/vdi2770-validate" python -m vdi2770_validate --version)
          test "$got" = "$WANT" || { echo "::error::asked for $WANT and ran $got"; exit 1; }

  # The README's shortest example is `- uses:` and `paths:` -- no `setup-python`,
  # no build. Every other use of the action here is preceded by both, so the line
  # a reader actually copies was the one nothing ran.
  the-action-on-a-runner-as-it-comes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same question as above, asked again rather than passed between jobs:
      # a reader copying the line gets whatever the index serves them that day.
      - name: The newest release the index serves
        id: newest
        run: |
          # `|| { ... }`, not a test on the next line. This step runs under
          # `bash --noprofile --norc -e -o pipefail`, so a failed lookup ends the
          # step where it happens and anything after it never runs -- a message
          # written below the assignment is a message nobody ever reads. That
          # exact mistake was made once already in this repository's own action.
          v=$(python3 -c "import json,urllib.request as u;print(json.load(u.urlopen('https://pypi.org/pypi/vdi2770-validate/json'))['info']['version'])") || {
            echo "::error::could not ask the index which release is newest"; exit 1; }
          test -n "$v" || { echo "::error::the index named no version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: The shortest example, against a release on the index
        uses: ./
        with:
          version: ${{ steps.newest.outputs.version }}
          paths: corpus/examples/container/documentcontainer.zip
