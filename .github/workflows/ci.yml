name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # One Windows row beside the three Linux ones, on the interpreter in the
  # middle of the supported range.
  #
  # Not for breadth. The gate that decides whether an import was declared reads
  # where a module actually loads from, and Windows keeps the extension modules
  # in `<base_prefix>\DLLs` -- a *sibling* of `Lib` rather than a child, so
  # `unicodedata` is not under the directory `sysconfig` calls `stdlib`. No
  # runner here could have shown that: on this project's own interpreters
  # `lib-dynload` sits under it. A sister project's Windows row found it, and
  # the repair had to be taken on trust.
  #
  # And this release moves console scripts and entry points, which is the part
  # of packaging that differs most between platforms: a script is a shim
  # executable there and a shebang file here, and `pip` writes both from the
  # same `entry_points.txt`.
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      # `fail-fast` off: one platform failing while the other is still running
      # tells you less than both answers do, and the question here is often
      # which of the two is wrong.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # The release workflows got this and this one did not, so the two
          # assertions that compare the tree against `sdk-v*` skipped on every
          # pull request -- silently, which is the only way a gate fails that
          # nobody notices. A default checkout is `--depth 1 --no-tags`.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The reader first, and from the working tree. The rules pin it
          # exactly, so a pip that reaches an index here would either fail (the
          # version is not published yet) or install a reader that is not the
          # one in this commit -- and the run would be about that instead.
          python -m pip install -e packages/vdi2770
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check --no-cache src tests tools packages
      - name: Build fixtures
        run: python tools/make_fixtures.py
      - name: Test
        if: runner.os != 'Windows'
        run: python -m pytest
      # The Windows row runs the part of the suite it was added for: where a
      # module loads from, what a distribution claims, and whether the two
      # halves of an installation agree. The rest of the suite is not
      # Windows-clean yet and the failures are the suite's rather than the
      # tool's -- `os.mkfifo`, `/dev/stdin`, a fixture path over the length
      # limit, and four assertions on one operating system's wording for a
      # missing file. Named here rather than swallowed: this job says what it
      # covers, and widening it is its own piece of work.
      - name: Test what differs by platform
        if: runner.os == 'Windows'
        run: python -m pytest tests/test_the_suite_declares_what_it_imports.py
          tests/test_no_two_distributions_claim_one_path.py
          tests/test_the_two_halves_have_to_agree.py
          tests/test_the_two_halves_carry_one_version.py
      # The question no reading of a tree can answer: does the file pip wrote
      # start, on the machine it wrote it on. This release moves where the tool
      # is installed from and which distribution owns the executable, and this
      # suite had never run on Windows -- where that file is `vdi2770-validate.exe`
      # and this harness used to answer "not installed at all" about it. Case 13
      # is every door on a working install; case 11 is the refusal, which has to
      # be exit 3 and not the exit 1 that means a container has findings.
      - name: The wheels install and run on this platform
        if: runner.os == 'Windows'
        run: |
          python -m pip install build
          python -m build packages/vdi2770 --outdir dist/
          python -m build --outdir dist/
          python tools/check_upgrade_paths.py --case 11 --case 13 --from dist

      - name: Corpus is unchanged
        if: runner.os != 'Windows'
        run: python tools/vendor_corpus.py --check
      - name: Firing coverage
        if: runner.os != 'Windows'
        run: python tools/rule_coverage.py --check
      - name: The rule reference matches the catalogue
        if: runner.os != 'Windows'
        run: python tools/rules_doc.py --check
      - name: Our half of the oracle sweep is current
        if: runner.os != 'Windows'
        run: python tools/capture_oracle.py --check-ours
      - name: The reader's API matches its version
        if: runner.os != 'Windows'
        run: python tools/api_fingerprint.py --check
      # Built and *run*, not built. A single file that imports and cannot answer
      # is the failure this catches, and the two look alike from outside.
      - name: No two distributions claim one path
        # Compared against what the index already serves, not only against this
        # tree: the destruction happens between a release and whatever an
        # installation already has.
        # Ubuntu only -- the wheels are pure Python and identical either way,
        # and this one talks to the index.
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: python tools/check_paths_are_disjoint.py
      # The release runs this against the wheels it is about to publish, and
      # its copy was red from the merge until somebody read it: the job
      # downloaded one of the two wheels the matrix needs. A gate first
      # exercised by the event it guards is not a gate, so the same question is
      # asked here, on the wheels this commit builds.
      - name: An install somebody already has survives these wheels
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          rm -rf dist
          python -m build packages/vdi2770 --outdir dist/
          python -m build --outdir dist/
          python tools/check_upgrade_paths.py --from dist
      - name: The single file builds and checks a container
        if: runner.os != 'Windows'
        run: python tools/build_zipapp.py --check
      - name: The sdist can run its own tests
        if: runner.os != 'Windows'
        run: |
          python -m pip install build
          python tools/check_sdist.py
          python tools/check_wheel.py
