name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The release workflows got this and this one did not, so the two
          # assertions that compare the tree against `sdk-v*` skipped on every
          # pull request -- silently, which is the only way a gate fails that
          # nobody notices. A default checkout is `--depth 1 --no-tags`.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # One install, both halves. The reader was its own distribution and
          # had to go first, from the working tree, or pip resolved the pin from
          # an index and the run was about a different reader than the commit.
          # It ships inside this one now, so there is no pin left to resolve.
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests tools packages
      - name: Build fixtures
        run: python tools/make_fixtures.py
      - name: Test
        run: python -m pytest
      - name: Corpus is unchanged
        run: python tools/vendor_corpus.py --check
      - name: Firing coverage
        run: python tools/rule_coverage.py --check
      - name: The rule reference matches the catalogue
        run: python tools/rules_doc.py --check
      - name: Our half of the oracle sweep is current
        run: python tools/capture_oracle.py --check-ours
      - name: The reader's API matches its version
        run: python tools/api_fingerprint.py --check
      # Built and *run*, not built. A single file that imports and cannot answer
      # is the failure this catches, and the two look alike from outside.
      - name: The single file builds and checks a container
        run: python tools/build_zipapp.py --check
      - name: The sdist can run its own tests
        run: |
          python -m pip install build
          python tools/check_sdist.py
          python tools/check_wheel.py
